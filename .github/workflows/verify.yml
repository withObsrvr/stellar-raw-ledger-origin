name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: |
            go.sum
            source/go.sum
      - name: Root tests and vet
        run: go test ./... && go vet ./...
      - name: Source tests, vet, and build
        run: cd source && go test ./... && go vet ./... && go build ./...
      - name: Packaging alignment
        run: make packaging-check
